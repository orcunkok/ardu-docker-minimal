# Example: two X500 SITL instances. Build first: DOCKER_BUILDKIT=0 docker build -t px4-x500/sitl .
# Each container runs INSTANCE=0 internally (UDP 18570 GCS, 14580 API); the host ports differ.
services:
  x500_1:
    image: px4-x500/sitl:latest
    environment:
      SYSID: "1"
      # GCS_HOST: "host.docker.internal"   # push MAVLink to a host GCS on 14550 (QGC auto-connect)
      # API_HOST: "192.168.1.50"           # push the API link to the OBC on 14540
    # extra_hosts: ["host.docker.internal:host-gateway"]  # needed on Linux for GCS_HOST above
    ports: ["18570:18570/udp", "14580:14580/udp"]
  x500_2:
    image: px4-x500/sitl:latest
    environment:
      SYSID: "2"
      HOME_LOC: "47.397742,8.546594,488"  # offset start so the drones don't overlap
    ports: ["18571:18570/udp", "14581:14580/udp"]
